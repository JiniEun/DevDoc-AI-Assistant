version: "3.8"

services:
  api:
    build: .
    container_name: devdoc-api
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    volumes:
      - ./app:/app 
      - ./data:/data

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: