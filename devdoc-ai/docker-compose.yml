version: "3.8"

services:
  api:
    build: .
    container_name: devdoc-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
      - TOP_K=3
      - API_KEY=          # 빈 값이면 인증 없음. 값을 설정하면 X-API-Key 헤더 필수
    depends_on:
      - ollama
    volumes:
      - devdoc_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: devdoc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  devdoc_data:
  ollama_data:
