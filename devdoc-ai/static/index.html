<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevDoc AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    @keyframes cursor-blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .typing-cursor::after {
      content: '▋';
      display: inline-block;
      animation: cursor-blink 0.8s step-start infinite;
      vertical-align: text-bottom;
      margin-left: 1px;
    }
    @keyframes bounce-dot {
      0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)}
    }
    .dot { animation: bounce-dot 1.2s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }

    /* Markdown rendering */
    .prose-ai p { margin-bottom: 0.6em; }
    .prose-ai p:last-child { margin-bottom: 0; }
    .prose-ai h1,.prose-ai h2,.prose-ai h3 { font-weight: 600; margin: 0.8em 0 0.4em; }
    .prose-ai h1 { font-size: 1.1em; }
    .prose-ai h2 { font-size: 1.05em; }
    .prose-ai h3 { font-size: 1em; }
    .prose-ai ul,.prose-ai ol { margin: 0.4em 0 0.6em 1.4em; }
    .prose-ai li { margin-bottom: 0.2em; }
    .prose-ai code {
      background: rgba(99,102,241,0.12);
      padding: 0.15em 0.4em;
      border-radius: 4px;
      font-size: 0.85em;
      font-family: 'Menlo','Monaco','Courier New',monospace;
    }
    .prose-ai pre {
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 0.8em 1em;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0.6em 0;
      font-size: 0.82em;
    }
    .prose-ai pre code { background: none; padding: 0; color: inherit; }
    .prose-ai strong { font-weight: 600; }
    .prose-ai blockquote {
      border-left: 3px solid #818cf8;
      padding-left: 0.75em;
      color: #6b7280;
      margin: 0.5em 0;
    }
    .dark .prose-ai blockquote { color: #9ca3af; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
    .dark ::-webkit-scrollbar-thumb { background: #4b5563; }

    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors duration-200">

<div class="flex flex-col h-full">

  <!-- ── Header ─────────────────────────────────────────────────────── -->
  <header class="flex-none bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 px-5 py-3 flex items-center justify-between shadow-sm z-10">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center text-white font-bold text-sm shadow-sm select-none">AI</div>
      <div>
        <h1 class="font-bold text-base leading-tight">DevDoc AI Assistant</h1>
        <p class="text-xs text-gray-400 dark:text-gray-500">문서 기반 AI 질의응답</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div id="status-badge" class="text-xs px-2.5 py-1 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 font-medium transition-all">연결 중...</div>
      <button id="dark-toggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors text-gray-500 dark:text-gray-400" title="다크 모드 전환">
        <svg class="w-4 h-4 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Body ───────────────────────────────────────────────────────── -->
  <div class="flex flex-1 min-h-0 overflow-hidden">

    <!-- ── Sidebar ──────────────────────────────────────────────────── -->
    <aside class="w-72 flex-none flex flex-col bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800">

      <!-- Upload zone -->
      <div class="p-4 border-b border-gray-200 dark:border-gray-800">
        <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-3">문서 업로드</p>
        <div id="drop-zone"
          class="border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-xl p-5 text-center cursor-pointer transition-all duration-200 hover:border-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 select-none"
          onclick="document.getElementById('file-input').click()">
          <div class="text-3xl mb-2">📁</div>
          <p class="text-sm font-medium text-gray-600 dark:text-gray-300">클릭하거나 드래그하세요</p>
          <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">PDF, TXT · 최대 50MB</p>
        </div>
        <input id="file-input" type="file" accept=".pdf,.txt" class="hidden" multiple>
        <div id="upload-status" class="hidden mt-2.5 flex items-center gap-2 text-sm text-indigo-600 dark:text-indigo-400">
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
          </svg>
          <span id="upload-status-text">업로드 중...</span>
        </div>
      </div>

      <!-- Document list -->
      <div class="flex-1 overflow-y-auto p-4">
        <div class="flex items-center justify-between mb-3">
          <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">업로드된 문서</p>
          <span id="doc-count" class="text-xs bg-indigo-100 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 px-2 py-0.5 rounded-full font-medium">0</span>
        </div>
        <div id="doc-list" class="space-y-2">
          <div id="doc-empty" class="text-center py-10 text-gray-400 dark:text-gray-600">
            <div class="text-3xl mb-2">📭</div>
            <p class="text-xs">업로드된 문서가 없습니다</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- ── Chat area ────────────────────────────────────────────────── -->
    <main class="flex-1 flex flex-col min-w-0 bg-gray-50 dark:bg-gray-950">

      <!-- Messages -->
      <div id="chat-messages" class="flex-1 overflow-y-auto p-5 space-y-5">
        <!-- Welcome -->
        <div class="flex items-start gap-3 max-w-2xl">
          <div class="w-8 h-8 bg-indigo-100 dark:bg-indigo-900/50 rounded-full flex items-center justify-center text-indigo-600 dark:text-indigo-400 text-xs font-bold flex-none mt-0.5">AI</div>
          <div class="bg-white dark:bg-gray-800 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm border border-gray-100 dark:border-gray-700/60">
            <p class="text-sm text-gray-700 dark:text-gray-300">안녕하세요! <strong>DevDoc AI Assistant</strong>입니다. 👋</p>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">왼쪽 패널에서 PDF 또는 TXT 문서를 업로드한 후 질문해보세요.</p>
          </div>
        </div>
      </div>

      <!-- Input bar -->
      <div class="flex-none bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 p-4">
        <div class="max-w-3xl mx-auto flex gap-3 items-end">
          <textarea id="query-input" rows="1"
            placeholder="문서에 대해 질문하세요..."
            class="flex-1 resize-none rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder-gray-400 dark:placeholder-gray-600"
            style="max-height:140px"
          ></textarea>
          <button id="send-btn"
            class="flex-none w-11 h-11 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 disabled:opacity-40 disabled:cursor-not-allowed text-white rounded-xl flex items-center justify-center transition-colors shadow-sm"
            title="전송 (Enter)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
            </svg>
          </button>
        </div>
        <p class="text-xs text-gray-400 dark:text-gray-600 text-center mt-2">Enter 전송 · Shift+Enter 줄바꿈</p>
      </div>
    </main>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container" class="fixed bottom-5 right-5 space-y-2 z-50 pointer-events-none"></div>

<script>
// ──────────────────────────── Dark mode ────────────────────────────────────
const html = document.documentElement;
const saved = localStorage.getItem('theme');
if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
  html.classList.add('dark');
}
document.getElementById('dark-toggle').addEventListener('click', () => {
  html.classList.toggle('dark');
  localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
});

// ──────────────────────────── State ────────────────────────────────────────
let isStreaming = false;

// ──────────────────────────── Health ───────────────────────────────────────
async function checkHealth() {
  const badge = document.getElementById('status-badge');
  try {
    const res = await fetch('/health');
    if (!res.ok) throw new Error();
    const data = await res.json();
    badge.textContent = `${data.documents}개 문서 · ${data.chunks}개 청크`;
    badge.className = 'text-xs px-2.5 py-1 rounded-full bg-green-100 dark:bg-green-900/40 text-green-700 dark:text-green-400 font-medium transition-all';
  } catch {
    badge.textContent = 'API 오프라인';
    badge.className = 'text-xs px-2.5 py-1 rounded-full bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400 font-medium transition-all';
  }
}

// ──────────────────────────── Documents ────────────────────────────────────
async function loadDocuments() {
  try {
    const res = await fetch('/documents');
    if (!res.ok) return;
    renderDocuments(await res.json());
  } catch (e) { console.error('load docs:', e); }
}

function renderDocuments(docs) {
  const list = document.getElementById('doc-list');
  const empty = document.getElementById('doc-empty');
  document.getElementById('doc-count').textContent = docs.length;
  list.querySelectorAll('.doc-item').forEach(el => el.remove());
  if (docs.length === 0) { empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');

  docs.forEach(doc => {
    const item = document.createElement('div');
    item.className = 'doc-item group flex items-start gap-2.5 p-2.5 rounded-lg bg-gray-50 dark:bg-gray-800/60 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors';
    const icon = doc.filename.toLowerCase().endsWith('.pdf') ? '📕' : '📄';
    item.innerHTML = `
      <span class="text-xl flex-none mt-0.5 leading-none">${icon}</span>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-medium text-gray-800 dark:text-gray-200 truncate" title="${escHtml(doc.filename)}">${escHtml(doc.filename)}</p>
        <p class="text-xs text-gray-400 dark:text-gray-500 mt-0.5">${doc.chunk_count}청크 · ${fmtDate(doc.upload_time)}</p>
      </div>
      <button class="flex-none opacity-0 group-hover:opacity-100 p-1 rounded hover:text-red-500 dark:hover:text-red-400 text-gray-400 transition-all" title="삭제"
        onclick="deleteDocument('${doc.doc_id}', '${escHtml(doc.filename)}')">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>`;
    list.appendChild(item);
  });
}

async function deleteDocument(docId, filename) {
  if (!confirm(`"${filename}" 문서를 삭제하시겠습니까?`)) return;
  try {
    const res = await fetch(`/documents/${docId}`, { method: 'DELETE' });
    if (res.ok) {
      showToast(`"${filename}" 삭제됨`, 'success');
      await Promise.all([loadDocuments(), checkHealth()]);
    } else {
      const err = await res.json().catch(() => ({}));
      showToast(err.detail || '삭제 실패', 'error');
    }
  } catch { showToast('네트워크 오류', 'error'); }
}

// ──────────────────────────── Upload ───────────────────────────────────────
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const uploadStatus = document.getElementById('upload-status');
const uploadStatusText = document.getElementById('upload-status-text');

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('border-indigo-400', 'bg-indigo-50', 'dark:bg-indigo-950/40');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('border-indigo-400', 'bg-indigo-50', 'dark:bg-indigo-950/40');
});
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('border-indigo-400', 'bg-indigo-50', 'dark:bg-indigo-950/40');
  uploadFiles([...e.dataTransfer.files]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) { uploadFiles([...fileInput.files]); fileInput.value = ''; }
});

async function uploadFiles(files) {
  const valid = files.filter(f => /\.(pdf|txt)$/i.test(f.name));
  if (!valid.length) { showToast('PDF 또는 TXT 파일만 지원합니다.', 'error'); return; }

  uploadStatus.classList.remove('hidden');
  dropZone.style.pointerEvents = 'none';
  let ok = 0;

  for (const [i, file] of valid.entries()) {
    uploadStatusText.textContent = `업로드 중... (${i + 1}/${valid.length}) ${file.name}`;
    try {
      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch('/upload', { method: 'POST', body: fd });
      if (res.ok) {
        const d = await res.json();
        showToast(`"${d.filename}" 완료 (${d.chunk_count}개 청크)`, 'success');
        ok++;
      } else {
        const err = await res.json().catch(() => ({}));
        showToast(`"${file.name}" 실패: ${err.detail || '알 수 없는 오류'}`, 'error');
      }
    } catch { showToast(`"${file.name}" 오류`, 'error'); }
  }

  uploadStatus.classList.add('hidden');
  dropZone.style.pointerEvents = '';
  if (ok) await Promise.all([loadDocuments(), checkHealth()]);
}

// ──────────────────────────── Chat ─────────────────────────────────────────
const chatMessages = document.getElementById('chat-messages');
const queryInput = document.getElementById('query-input');
const sendBtn = document.getElementById('send-btn');

queryInput.addEventListener('input', () => {
  queryInput.style.height = 'auto';
  queryInput.style.height = Math.min(queryInput.scrollHeight, 140) + 'px';
});
queryInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!isStreaming) sendMessage(); }
});
sendBtn.addEventListener('click', () => { if (!isStreaming) sendMessage(); });

function addUserBubble(text) {
  const d = document.createElement('div');
  d.className = 'flex justify-end';
  d.innerHTML = `
    <div class="max-w-xl bg-indigo-600 text-white rounded-2xl rounded-tr-sm px-4 py-3 shadow-sm">
      <p class="text-sm whitespace-pre-wrap break-words">${escHtml(text)}</p>
    </div>`;
  chatMessages.appendChild(d);
  scrollBottom();
}

function addLoadingBubble() {
  const d = document.createElement('div');
  d.className = 'flex items-start gap-3 max-w-2xl';
  d.innerHTML = `
    <div class="w-8 h-8 bg-indigo-100 dark:bg-indigo-900/50 rounded-full flex items-center justify-center text-indigo-600 dark:text-indigo-400 text-xs font-bold flex-none mt-0.5">AI</div>
    <div class="bg-white dark:bg-gray-800 rounded-2xl rounded-tl-sm px-4 py-3.5 shadow-sm border border-gray-100 dark:border-gray-700/60">
      <div class="flex gap-1.5 items-center h-4">
        <span class="dot w-2 h-2 bg-gray-400 rounded-full inline-block"></span>
        <span class="dot w-2 h-2 bg-gray-400 rounded-full inline-block"></span>
        <span class="dot w-2 h-2 bg-gray-400 rounded-full inline-block"></span>
      </div>
    </div>`;
  chatMessages.appendChild(d);
  scrollBottom();
  return d;
}

function addAssistantBubble() {
  const d = document.createElement('div');
  d.className = 'flex items-start gap-3 max-w-2xl';
  d.innerHTML = `
    <div class="w-8 h-8 bg-indigo-100 dark:bg-indigo-900/50 rounded-full flex items-center justify-center text-indigo-600 dark:text-indigo-400 text-xs font-bold flex-none mt-0.5">AI</div>
    <div class="flex-1 min-w-0">
      <div class="bg-white dark:bg-gray-800 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm border border-gray-100 dark:border-gray-700/60">
        <div class="msg-text text-sm text-gray-700 dark:text-gray-300 typing-cursor"></div>
      </div>
      <div class="sources-wrap mt-1.5 hidden"></div>
    </div>`;
  chatMessages.appendChild(d);
  scrollBottom();
  return d;
}

async function sendMessage() {
  const query = queryInput.value.trim();
  if (!query) return;

  queryInput.value = '';
  queryInput.style.height = 'auto';
  addUserBubble(query);

  isStreaming = true;
  sendBtn.disabled = true;
  queryInput.disabled = true;

  const loadingEl = addLoadingBubble();

  try {
    const res = await fetch('/ask/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query }),
    });

    loadingEl.remove();

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      addErrorBubble(err.detail || '서버 오류가 발생했습니다.');
      return;
    }

    const msgEl = addAssistantBubble();
    const textEl = msgEl.querySelector('.msg-text');
    const sourcesWrap = msgEl.querySelector('.sources-wrap');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop() ?? '';

      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        let data;
        try { data = JSON.parse(part.slice(6)); } catch { continue; }

        if (data.type === 'token') {
          fullText += data.content;
          textEl.textContent = fullText;
          scrollBottom();
        } else if (data.type === 'done') {
          textEl.classList.remove('typing-cursor');
          // Render as markdown
          textEl.innerHTML = marked.parse(fullText, { breaks: true });
          textEl.classList.add('prose-ai');
          if (data.sources?.length) renderSources(sourcesWrap, data.sources);
        } else if (data.type === 'error') {
          textEl.classList.remove('typing-cursor');
          textEl.textContent = `오류: ${data.content}`;
          textEl.classList.add('text-red-500');
        }
      }
    }
    textEl.classList.remove('typing-cursor');

  } catch (e) {
    loadingEl.remove();
    addErrorBubble('연결 오류가 발생했습니다. 서버 상태를 확인해주세요.');
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    queryInput.disabled = false;
    queryInput.focus();
  }
}

function addErrorBubble(msg) {
  const d = document.createElement('div');
  d.className = 'flex items-start gap-3 max-w-2xl';
  d.innerHTML = `
    <div class="w-8 h-8 bg-red-100 dark:bg-red-900/40 rounded-full flex items-center justify-center text-red-500 text-xs font-bold flex-none mt-0.5">!</div>
    <div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800/60 rounded-2xl rounded-tl-sm px-4 py-3">
      <p class="text-sm text-red-600 dark:text-red-400">${escHtml(msg)}</p>
    </div>`;
  chatMessages.appendChild(d);
  scrollBottom();
}

function renderSources(container, sources) {
  container.classList.remove('hidden');
  const btn = document.createElement('button');
  btn.className = 'flex items-center gap-1.5 text-xs text-gray-400 dark:text-gray-500 hover:text-indigo-500 dark:hover:text-indigo-400 transition-colors mt-0.5';
  btn.innerHTML = `
    <svg class="w-3 h-3 transition-transform duration-150" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
    </svg>
    <span>참고 문서 ${sources.length}개 보기</span>`;

  const list = document.createElement('div');
  list.className = 'hidden mt-2 space-y-2';

  sources.forEach(src => {
    const item = document.createElement('div');
    item.className = 'text-xs bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60 rounded-xl p-3';
    item.innerHTML = `
      <p class="font-semibold text-amber-800 dark:text-amber-300 mb-1">📎 ${escHtml(src.filename)}</p>
      <p class="text-gray-600 dark:text-gray-400 line-clamp-3 leading-relaxed">${escHtml(src.text)}</p>`;
    list.appendChild(item);
  });

  btn.addEventListener('click', () => {
    const open = !list.classList.contains('hidden');
    list.classList.toggle('hidden');
    btn.querySelector('svg').style.transform = open ? '' : 'rotate(90deg)';
    btn.querySelector('span').textContent = open
      ? `참고 문서 ${sources.length}개 보기`
      : `참고 문서 ${sources.length}개 닫기`;
  });

  container.appendChild(btn);
  container.appendChild(list);
}

// ──────────────────────────── Helpers ──────────────────────────────────────
function scrollBottom() {
  requestAnimationFrame(() => { chatMessages.scrollTop = chatMessages.scrollHeight; });
}

function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function showToast(msg, type = 'info') {
  const c = document.getElementById('toast-container');
  const colors = { success: 'bg-emerald-600', error: 'bg-red-600', info: 'bg-gray-700' };
  const t = document.createElement('div');
  t.className = `pointer-events-auto ${colors[type] ?? colors.info} text-white text-sm px-4 py-3 rounded-xl shadow-lg max-w-xs flex items-center gap-2`;
  const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
  t.innerHTML = `<span class="font-bold">${icon}</span><span>${escHtml(msg)}</span>`;
  c.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity 0.3s, transform 0.3s';
    t.style.opacity = '0';
    t.style.transform = 'translateY(8px)';
    setTimeout(() => t.remove(), 320);
  }, 3500);
}

// ──────────────────────────── Init ─────────────────────────────────────────
checkHealth();
loadDocuments();
</script>
</body>
